<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Формат данных: смысловой блок команды</title>
  <desc id="desc">Схема семантического блока с основной формой, вариантами действия и объектами.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f7f3"/><stop offset="1" stop-color="#edf4eb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#294735" flood-opacity=".09"/></filter>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#1f3025;letter-spacing:-.8px}.subtitle{font:16px Arial,sans-serif;fill:#708173}.eyebrow,.label{font:700 12px Arial,sans-serif;fill:#68806e;letter-spacing:2px}.label{letter-spacing:1.2px}.body{font:16px Arial,sans-serif;fill:#27372b}.code{font:16px monospace;fill:#27372b}.field{font:16px monospace;fill:#5d8966}.small{font:13px Arial,sans-serif;fill:#607a65}.chip{font:700 14px Arial,sans-serif;fill:#426d4e}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/><circle cx="1122" cy="82" r="135" fill="#dbead9" opacity=".62"/><circle cx="1075" cy="105" r="78" fill="#eef6ec"/>
  <text x="72" y="78" class="eyebrow">ИНДЕКС КОМАНД / МОДЕЛЬ ДАННЫХ</text><text x="72" y="128" class="title">Один блок — один смысл команды</text><text x="72" y="159" class="subtitle">Основная формулировка нужна всегда. Варианты действия и объекта — опциональны.</text>
  <rect x="72" y="205" width="700" height="414" rx="22" fill="#fff" filter="url(#shadow)"/><text x="110" y="251" class="label">ОБЫЧНАЯ КОМАНДА</text><rect x="108" y="274" width="628" height="282" rx="14" fill="#f7faf6" stroke="#dce8da"/>
  <text x="142" y="321" class="code">{</text><text x="167" y="321" class="field">"text"</text><text x="231" y="321" class="code">: "включи свет на кухне",</text>
  <text x="167" y="369" class="field">"actions"</text><text x="255" y="369" class="code">: ["включить", "зажечь"],</text>
  <text x="167" y="417" class="field">"objects"</text><text x="255" y="417" class="code">: ["свет на кухне",</text><text x="275" y="445" class="code">"кухонный свет", "подсветку на кухне"]</text><text x="142" y="496" class="code">}</text>
  <line x1="142" y1="524" x2="702" y2="524" stroke="#dce8da"/><text x="142" y="587" class="body">text — видимое имя блока и надёжная форма для поиска.</text>
  <rect x="810" y="205" width="318" height="414" rx="22" fill="#e3f0e2" stroke="#c5dcc6" filter="url(#shadow)"/><text x="846" y="251" class="label">КАК ЧИТАТЬ ПОЛЯ</text>
  <rect x="846" y="282" width="246" height="74" rx="12" fill="#f9fcf8" stroke="#c5dcc6"/><text x="866" y="311" class="chip">text</text><text x="866" y="336" class="small">обязательная основная форма</text>
  <rect x="846" y="372" width="246" height="74" rx="12" fill="#f9fcf8" stroke="#c5dcc6"/><text x="866" y="401" class="chip">actions</text><text x="866" y="426" class="small">синонимы в начальной форме</text>
  <rect x="846" y="462" width="246" height="74" rx="12" fill="#f9fcf8" stroke="#c5dcc6"/><text x="866" y="491" class="chip">objects</text><text x="866" y="516" class="small">варианты объекта</text>
  <text x="846" y="568" class="small">Для специальной команды</text><text x="846" y="590" class="small">достаточно одного text:</text><text x="846" y="613" class="code">{ "text": "дальше" }</text>
  <rect x="72" y="657" width="1056" height="48" rx="12" fill="#e2efe0"/><circle cx="102" cy="681" r="7" fill="#5d9b68"/><text x="122" y="687" class="body">Комнаты и другие уточнения входят в объект: «свет на кухне» — одна смысловая единица.</text>
</svg>
