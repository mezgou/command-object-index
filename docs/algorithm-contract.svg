<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Контракт алгоритма ранжирования</title>
  <desc id="desc">Схема входных данных, работы алгоритма и массива результатов.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f7f3"/><stop offset="1" stop-color="#edf4eb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#294735" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 Z" fill="#78a27d"/></marker>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#1f3025;letter-spacing:-.8px}.subtitle{font:16px Arial,sans-serif;fill:#708173}.eyebrow,.label{font:700 12px Arial,sans-serif;fill:#68806e;letter-spacing:2px}.label{letter-spacing:1.2px}.body{font:15px Arial,sans-serif;fill:#27372b}.code{font:15px monospace;fill:#27372b}.strong{font:700 19px Arial,sans-serif;fill:#27372b}.small{font:13px Arial,sans-serif;fill:#819182}.code-small{font:13px monospace;fill:#5d8966}.inverse{fill:#fff}.inverse-soft{fill:#c8ddca}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/><circle cx="1080" cy="82" r="138" fill="#dbead9" opacity=".62"/>
  <text x="72" y="78" class="eyebrow">ИНДЕКС КОМАНД / ПЛАТФОРМА АЛГОРИТМОВ</text><text x="72" y="128" class="title">Контракт: запрос на входе, рейтинг на выходе</text><text x="72" y="159" class="subtitle">Каждый алгоритм заменяем: он получает одинаковые данные и возвращает одинаковый формат; уверенность и объяснение — по желанию.</text>
  <rect x="72" y="218" width="300" height="302" rx="20" fill="#fff" filter="url(#shadow)"/><text x="108" y="261" class="label">01 / ВХОД</text><text x="108" y="302" class="strong">query + blocks</text><rect x="108" y="326" width="228" height="44" rx="8" fill="#eff7ed"/><text x="126" y="354" class="code">query: "включи свет"</text><text x="108" y="405" class="body">Список блоков содержит text,</text><text x="108" y="429" class="body">actions и objects.</text><text x="108" y="474" class="small">Одинаковый вход для каждого</text><text x="108" y="494" class="small">выбранного метода.</text>
  <line x1="394" y1="369" x2="472" y2="369" stroke="#78a27d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="496" y="218" width="300" height="302" rx="20" fill="#e3f0e2" stroke="#c5dcc6" filter="url(#shadow)"/><text x="532" y="261" class="label">02 / АЛГОРИТМ</text><text x="532" y="302" class="strong">search(query, blocks)</text><rect x="532" y="330" width="228" height="52" rx="8" fill="#f9fcf8" stroke="#c5dcc6"/><text x="551" y="361" class="body">сравнивает и ранжирует</text><text x="532" y="416" class="small">Например: перебирает</text><text x="532" y="438" class="small">«действие + объект» и</text><text x="532" y="460" class="small">«объект + действие».</text><text x="532" y="488" class="small">Любой новый метод соблюдает</text><text x="532" y="507" class="small">тот же контракт.</text>
  <line x1="818" y1="369" x2="896" y2="369" stroke="#78a27d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="920" y="218" width="208" height="302" rx="20" fill="#fff" filter="url(#shadow)"/><text x="956" y="261" class="label">03 / ВЫХОД</text><text x="956" y="302" class="strong">results[]</text><text x="956" y="342" class="code">index: 1</text><text x="956" y="370" class="code">text: "..."</text><text x="956" y="398" class="code">score: 0.94</text><line x1="956" y1="422" x2="1092" y2="422" stroke="#dce8da"/><text x="956" y="446" class="small">по желанию:</text><text x="956" y="470" class="code-small">decision · status</text><text x="956" y="492" class="code-small">command · explain</text>
  <rect x="72" y="571" width="1056" height="112" rx="18" fill="#fff" stroke="#dce8da"/><text x="108" y="612" class="label">ЕДИНАЯ ТОЧКА РАСШИРЕНИЯ</text><text x="108" y="653" class="code">algo/config.py  →  id, name, description, module, function</text><text x="685" y="645" class="body">Добавили файл и строку конфигурации —</text><text x="685" y="668" class="body">метод появляется в интерфейсе.</text>
</svg>
