<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MVP: смысловые блоки и поиск по формам</title>
  <desc id="desc">Веб-интерфейс редактирует каталог смысловых блоков. Поиск собирает формы действие плюс объект и объект плюс действие, выбирает минимальную дистанцию Левенштейна и выводит ранжированные канонические команды.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#62766a"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#294735" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#f5f7f3"/>
  <g font-family="Arial, sans-serif" fill="#203126">
    <text x="70" y="65" font-size="32" font-weight="700">MVP · поиск по смысловым блокам</text>
    <text x="70" y="96" font-size="17" fill="#617267">Каноническая команда остаётся результатом, а поиск знает её варианты</text>

    <g filter="url(#shadow)">
      <rect x="70" y="145" width="420" height="310" rx="18" fill="#fff" stroke="#d7e3d6" stroke-width="2"/>
      <rect x="710" y="145" width="420" height="310" rx="18" fill="#fff" stroke="#d7e3d6" stroke-width="2"/>
      <rect x="390" y="560" width="420" height="130" rx="18" fill="#eef7ed" stroke="#8fbb93" stroke-width="2"/>
    </g>

    <text x="100" y="188" font-size="23" font-weight="700">1 · Каталог блоков</text>
    <text x="100" y="222" font-size="15" fill="#6c7e70">Каждая запись — один смысл, например:</text>
    <rect x="100" y="242" width="360" height="172" rx="10" fill="#f4f8f3"/>
    <g font-family="Courier New, monospace" font-size="14" fill="#405947">
      <text x="120" y="272">text: «включи свет на кухне»</text>
      <text x="120" y="302">actions: включить · включи · включишь</text>
      <text x="120" y="332">objects: свет на кухне ·</text>
      <text x="120" y="354">         кухонный свет · подсветку на кухне</text>
      <text x="120" y="388" fill="#6f9375">или только text для «дальше»</text>
    </g>

    <text x="740" y="188" font-size="23" font-weight="700">2 · Генерация и сравнение</text>
    <g font-size="17" fill="#455d4b">
      <text x="740" y="227">Для каждой пары формируются:</text>
      <text x="760" y="263">• действие + объект</text>
      <text x="760" y="294">• объект + действие</text>
      <text x="760" y="325">• канонический text</text>
    </g>
    <rect x="740" y="350" width="360" height="68" rx="10" fill="#f4f8f3"/>
    <text x="760" y="378" font-size="15" fill="#405947">«включи кухонный свет»</text>
    <text x="760" y="402" font-size="14" fill="#719176">минимальная дистанция = 0</text>

    <text x="418" y="603" font-size="23" font-weight="700">3 · Ранжированный результат</text>
    <text x="418" y="635" font-size="17" fill="#455d4b">канонический text + лучшая совпавшая форма</text>
    <text x="418" y="664" font-size="15" fill="#719176">шкала близости · расстояние · подсветка от 80%</text>

    <g fill="none" stroke="#62766a" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M490 300H700"/>
      <path d="M920 455V540H805"/>
      <path d="M280 455V535H390"/>
    </g>
    <g font-size="14" fill="#718276">
      <text x="595" y="288" text-anchor="middle">блоки</text>
      <text x="940" y="505">кандидаты</text>
      <text x="286" y="507">редактирование</text>
    </g>

    <g>
      <rect x="70" y="518" width="210" height="54" rx="9" fill="#e7f1e7"/>
      <text x="91" y="551" font-size="14" font-weight="700" fill="#4e7656">Веб-интерфейс</text>
      <rect x="920" y="518" width="210" height="54" rx="9" fill="#e7f1e7"/>
      <text x="941" y="551" font-size="14" font-weight="700" fill="#4e7656">Левенштейн</text>
    </g>
  </g>
</svg>
