<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Почему мы перешли к лемматизации и синонимам действий</title>
  <desc id="desc">Сравнение версии коллеги с объединённой схемой и лемматизацией на 138 запросах.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7f3"/><stop offset="1" stop-color="#edf4eb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#294735" flood-opacity=".07"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#75a27c"/></marker>
    <style>
      .eyebrow{font:700 12px Arial,sans-serif;fill:#68806e;letter-spacing:1.8px}
      .title{font:700 34px Arial,sans-serif;fill:#1f3025;letter-spacing:-.6px}
      .subtitle{font:16px Arial,sans-serif;fill:#708173}
      .label{font:700 12px Arial,sans-serif;fill:#68806e;letter-spacing:1.2px}
      .heading{font:700 21px Arial,sans-serif;fill:#27372b}
      .body{font:15px Arial,sans-serif;fill:#36493a}
      .small{font:13px Arial,sans-serif;fill:#6d8270}
      .code{font:15px monospace;fill:#365d41}
      .metric{font:700 18px Arial,sans-serif;fill:#27372b}
      .gain{font:700 14px Arial,sans-serif;fill:#417e50}
      .foot{font:12px Arial,sans-serif;fill:#718276}
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1125" cy="72" r="125" fill="#dcebd9" opacity=".65"/>
  <text x="72" y="72" class="eyebrow">ИНДЕКС КОМАНД / ВЫБОР ПОДХОДА</text>
  <text x="72" y="119" class="title">Меньше словоформ в данных — больше смысла</text>
  <text x="72" y="151" class="subtitle">Лемматизация приводит слова к начальной форме; каталог хранит синонимы действия.</text>

  <rect x="72" y="191" width="510" height="236" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="104" y="230" class="label">РАНЬШЕ / СЛОВОФОРМЫ</text>
  <text x="104" y="266" class="heading">Перечисляли формы вручную</text>
  <rect x="104" y="285" width="446" height="55" rx="10" fill="#f5f8f4" stroke="#dce8da"/>
  <text x="122" y="318" class="code">включить · включи · включишь</text>
  <text x="104" y="371" class="body">Словоформы для поиска хранились в каталоге.</text>
  <text x="104" y="395" class="small">Структурный метод обобщал синонимы на все объекты.</text>

  <rect x="618" y="191" width="510" height="236" rx="20" fill="#e6f2e4" stroke="#c7dfc8" filter="url(#shadow)"/>
  <text x="650" y="230" class="label">ТЕПЕРЬ / ЛЕММЫ И СИНОНИМЫ</text>
  <text x="650" y="266" class="heading">Один блок хранит смысл</text>
  <rect x="650" y="285" width="446" height="55" rx="10" fill="#fbfdfb" stroke="#c7dfc8"/>
  <text x="668" y="318" class="code">actions: [включить, зажечь]</text>
  <text x="650" y="371" class="body">«Включите» → «включить» → поиск по блоку.</text>
  <text x="650" y="395" class="small">Для кондиционера «зажечь» не добавляем.</text>

  <rect x="72" y="464" width="1056" height="263" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="104" y="507" class="label">НАШ ЭКСПЕРИМЕНТ / ДО → ПОСЛЕ</text>
  <text x="104" y="540" class="small">Медиана времени на запрос после подготовки каталога · итоговая оценка: больше — лучше</text>
  <text x="104" y="574" class="label">АЛГОРИТМ</text>
  <text x="403" y="574" class="label">ВРЕМЯ</text>
  <text x="800" y="574" class="label">ОЦЕНКА</text>
  <line x1="104" y1="586" x2="1096" y2="586" stroke="#e1eae0"/>
  <text x="104" y="619" class="body">Левенштейн</text>
  <text x="403" y="619" class="metric">45,6 → 20,1 мс</text><text x="613" y="619" class="gain">≈ 2,3× быстрее</text>
  <text x="800" y="619" class="metric">0,789 → 0,816</text>
  <text x="104" y="655" class="body">TF-IDF</text>
  <text x="403" y="655" class="metric">0,403 → 0,256 мс</text><text x="613" y="655" class="gain">≈ 1,6× быстрее</text>
  <text x="800" y="655" class="metric">0,769 → 0,790</text>
  <text x="104" y="691" class="body">Структурный</text>
  <text x="403" y="691" class="metric">0,156 → 0,138 мс</text><text x="613" y="691" class="small">практически так же</text>
  <text x="800" y="691" class="metric">0,989 → 1,000</text>

  <rect x="72" y="755" width="1056" height="84" rx="14" fill="#e2efe0"/>
  <text x="98" y="783" class="foot">138 запросов; один компьютер; каталог подготовлен, запросы без предварительного прогрева; повторные слова кэшируются.</text>
  <text x="98" y="805" class="foot">Одновременно изменились нормализация и каталог — влияние одной лемматизации не выделено отдельно.</text>
  <text x="98" y="826" class="foot">Top-1 Левенштейна снизился. Датасет создавался вместе со структурным методом; подробности — в evaluation/README.md.</text>
</svg>
