<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">Вариант развития проекта</title>
<desc id="desc">Четыре блока: интерфейс, алгоритм поиска, словарь и датасет с оценкой. Стрелки показывают обмен данными между ними.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker>
</defs>
<rect width="1200" height="810" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#17243a">
  <text x="75" y="68" font-size="32" font-weight="700">Вариант развития проекта</text>
  <text x="75" y="101" font-size="17" fill="#59697e">Поиск подходящих команд и объектов по текстовому запросу</text>
  <!-- Cards -->
  <rect x="75" y="150" width="420" height="210" rx="16" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="705" y="150" width="420" height="210" rx="16" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="75" y="530" width="420" height="210" rx="16" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="705" y="530" width="420" height="210" rx="16" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <text x="103" y="193" font-size="23" font-weight="700">3 · Интерфейс / симулятор</text>
  <g font-size="18" fill="#43536a">
    <text x="103" y="237">• Ввод запроса</text>
    <text x="103" y="273">• Ранжированные результаты</text>
    <text x="103" y="309">• Редактирование словаря</text>
  </g>
  <text x="733" y="193" font-size="23" font-weight="700">1 · Алгоритм поиска</text>
  <g font-size="18" fill="#43536a">
    <text x="733" y="237">• Нормализация запроса</text>
    <text x="733" y="273">• Поиск и сопоставление</text>
    <text x="733" y="309">• Ранжирование кандидатов</text>
  </g>
  <text x="103" y="573" font-size="23" font-weight="700">2 · Словарь / хранение</text>
  <g font-size="18" fill="#43536a">
    <text x="103" y="617">• Команды и объекты</text>
    <text x="103" y="653">• Названия и синонимы</text>
    <text x="103" y="689">• Допустимые сочетания</text>
  </g>
  <text x="733" y="573" font-size="23" font-weight="700">4 · Датасет и оценка</text>
  <g font-size="18" fill="#43536a">
    <text x="733" y="617">• Тестовые запросы и ответы</text>
    <text x="733" y="653">• Скрипт оценки алгоритма</text>
    <text x="733" y="689">• Сравнение версий поиска</text>
  </g>
  <!-- Connectors -->
  <g fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 495 226 H 700"/>
    <path d="M 705 287 H 500"/>
    <path d="M 285 360 V 525"/>
    <path d="M 495 610 H 555 V 445 H 915 V 365"/>
    <path d="M 1010 530 V 365"/>
  </g>
  <g font-size="15" fill="#59697e">
    <text x="600" y="213" text-anchor="middle">запрос</text>
    <text x="600" y="312" text-anchor="middle">кандидаты</text>
    <text x="300" y="448">изменения</text>
    <text x="730" y="435" text-anchor="middle">данные для поиска</text>
    <text x="1023" y="452">тесты</text>
    <text x="1023" y="473">и оценка</text>
  </g>
</g>
</svg>
